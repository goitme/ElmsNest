<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goodnight · ספוטים-ופרוז-קטורים-סולאריים</title>
<script>document.documentElement.classList.add('env2-js');</script>
<link rel="stylesheet" href="../../../assets/fonts.css">
<style>
/* ---------- tokens (§3.1) ---------- */
:root{
  --env2-sky-0:#4a6a9c;--env2-sky-1:#1f3357;--env2-sky-2:#0f1a2f;--env2-sky-3:#070b15;--env2-sky-4:#020306;
  --env2-ink:#f4eee3;--env2-ink-2:#c9c4b8;--env2-mute:#8f95a3;
  --env2-gold:#e9b96e;--env2-glow:#ffd394;--env2-ember:#f7a24a;--env2-btn-ink:#1a1206;
  --env2-hair:rgba(244,238,227,.12);--env2-hair-btn:rgba(244,238,227,.25);--env2-hair-num:rgba(244,238,227,.45);
  --env2-scrim:rgba(5,8,14,.55);
  --env2-gut:clamp(20px,4vw,64px);--env2-w:1240px;
  --env2-p:0;--p:0;
}

/* ---------- page ground (§3.1), every template ----------
   Kalles paints body with its scheme and wraps content in painted containers; here the document
   is night on every page type and the wrappers go clear. The index keeps its own dusk gradient
   (snippets/elmsnest-v2-ground-index, rendered by the hero); every other template gets the
   side-page ground: sky-2 -> sky-3 -> sky-4, ending in #020306 before the footer. */
html{background:#020306}
body[class*="hdt-page-type-"]{background-color:#020306;color:#f4eee3}
body[class*="hdt-page-type-"]:not(.hdt-page-type-index){
  background-image:linear-gradient(180deg,#0f1a2f 0%,#070b15 45%,#020306 100%);
  background-repeat:no-repeat;background-size:100% 100%;background-attachment:scroll;
  min-height:100vh;
}
#wrapper,.main-content,main,#MainContent,.hdt-main-content,.hdt-page-content,.shopify-section{background:transparent}
/* Kalles back-to-top: a white square bottom-right (old palette) — hidden everywhere (§7.11) */
.hdt-back-to-top,back-to-top{display:none!important}
/* Kalles footer group: same sans as the page, quiet links (underline on hover only).
   The link rules must reach (0,2,2): the footer links sit inside .hdt-text-warry.hdt-rte, and Kalles'
   .hdt-rte a:not(.hdt-btn){text-decoration:underline} is (0,2,1), so the plain unscoped selector (0,1,1)
   lost to it and every footer link came back underlined (fix pass R0-01). The index-scoped rule this
   replaced was body.hdt-page-type-index .shopify-section-group-footer-group a = (0,2,2) and did win. */
.shopify-section-group-footer-group{font-family:var(--env2-sans)}
body .shopify-section-group-footer-group a:not(.hdt-btn){text-decoration:none}
body .shopify-section-group-footer-group a:not(.hdt-btn):hover,body .shopify-section-group-footer-group a:not(.hdt-btn):focus-visible{text-decoration:underline}
/* Kalles chrome type: header menu, drawers, popovers, facets and the old sections use Heebo.
   css-variables sets --f_family_1..3 on :root from the Shopify font (assistant_n4); this comes after it. */
:root{--f_family_1:var(--env2-sans);--f_family_2:var(--env2-sans);--f_family_3:var(--env2-sans)}
/* interim (until the collection is rebuilt, round 2): sort entries that imply sales data are hidden;
   sale badges never render (settings hidden_badges + this belt) */
option[value="best-selling"],hdt-richlist button[role="option"][value="best-selling"]{display:none}
.hdt-badge__wrapp{display:none!important}
/* Kalles form fields: the theme paints a field with rgb(var(--color-input-primary)) and writes it with
   --color-input-secondary. Both the :root fallback (css-variables l.185-186) and the night scheme's
   input pair still carry cream-era values, so every form rendered a light slab with 2.7:1 text on the
   night ground (contact form, account/login/register, the cart discount field). Night field, ink text.
   --en-input-bg is the last #fffdf7 in the token set (the header search field) — retargeted with it. */
:root{--en-input-bg:17 29 51}
:root,[color-scheme]{--color-input-primary:var(--en-surface-elevated);--color-input-secondary:var(--en-color-light)}
/* Kalles accent buttons hard-code white labels (.hdt-btn-accent{--hdt-btn-color:255 255 255}); under the
   night scheme their fill is --env2-glow, so the label needs the dark ink (§D): 1.4:1 -> 13:1. */
.hdt-btn-accent{--hdt-btn-color:var(--en-text-inverse)}
/* Kalles swatch/tooltip bubble: css-variables pairs --color-tooltip-background with
   --color-tooltip-text, and §D moved BOTH ends of that pair to near-black (--en-color-dark 2 3 6 /
   --en-text-inverse 2 3 6) — the bubble is ink-on-ink. Night bubble, ink label (hover only). */
:root{--color-tooltip-background:var(--en-surface-elevated);--color-tooltip-text:var(--en-color-light)}

/* ---------- fix pass, round 0 second pass (V-1 · V-2 · V-4 · V-6) ---------- */
/* V-1: the header search panel is <hdt-predictive-search color-scheme="scheme-1"> — the attribute is written
   in a Kalles core section we do not own, so settings.color_scheme_dialog never reaches it, and scheme-1 is
   the cream scheme (#f7f0e6 background, #fffdf7 background2, #2b2118 foreground): the three hexes this round
   forbids, on the drawer behind the magnifier on every template. scheme-1 is remapped onto the night pair.
   Exactly one element per page carries it (the search panel, closed) — the homepage included — so nothing
   else can move. The input pair is deliberately NOT listed here: the :root,[color-scheme] rule above owns it
   at the same specificity and must keep winning. */
[color-scheme="scheme-1"]{
  --color-background:2 3 6;--color-background2:7 11 21;--color-foreground:244 238 227;--color-foreground2:201 196 184;
  --color-accent:255 211 148;--color-secondary:208 182 135;--color-tertiary:155 122 61;
  --hdt-btn-color:26 18 6;--hdt-btn-bg:255 211 148;--hdt-btn-border-color:255 211 148;
  --hdt-btn-hover-color:26 18 6;--hdt-btn-hover-bg:var(--en-surface-card);--hdt-btn-hover-border-color:var(--en-surface-card);
  --hdt-btn-secondary-color:83 73 54;--hdt-btn-secondary-bg:208 182 135;
  --hdt-btn-tertiary-color:62 49 24;--hdt-btn-tertiary-bg:155 122 61;
  --hdt-btn-outline-color:244 238 227;--hdt-btn-outline-border-color:244 238 227;
  --hdt-link-color:244 238 227;--hdt-link-hover-color:255 211 148;
  --color-line-border:31 30 29;--color-overlay:2 3 6;--payment-terms-background-color:rgb(2 3 6);
  --color-pr-price:255 211 148;--color-pr-sale-price:255 211 148;--color-pr-text:244 238 227;
  --color-focus:var(--en-focus-dark);--en-focus-contrast:var(--en-focus-light)
}
/* the search drawer's category <select> and its options paint from the UA, not from the scheme (old open item 5) */
#drawer-search-form select,#drawer-search-form option{background-color:rgb(var(--en-surface-elevated));color:rgb(var(--en-color-light))}
/* V-4: <dialog id="modal-contactFormAsk"> has no background rule of its own, so it falls back to the UA's
   white canvas while its wrapper's night scheme paints the ink — heading 1.15:1, field labels 1.74:1. */
#modal-contactFormAsk{background:rgb(var(--en-surface-elevated));color:rgb(var(--en-text-primary))}
/* V-6: --en-warning-text (96 64 0) was built for the cream page; §D moved the ground to #020306 and did not
   list it, so .hdt-no-result-product — the only copy on the no-results page — reads 2.19:1. The amber the
   design system already uses gives 11.9:1 on #020306. The two other consumers (.toast.warning border,
   .toast-icon.warning fill, which pairs it with --en-text-inverse) stay legible. */
:root{--en-warning-text:255 211 148}
/* V-2: the product card's "בחירת אפשרויות" action (.hdt-card-product__btn-ultra). Kalles reveals it on card
   hover on a pointer device, where it computed ink-on-ink; where there is no hover (390) it never fades out,
   so it renders as an opaque #020306 square over the photo on every card with a 1:1 glyph inside it.
   Legible pair for the pointer case; painted out (layout untouched) where there is no hover, and below 900px
   where the grid is 2-up and a 36px overlay on a small card has nothing to reveal — the whole card already
   links to the PDP and show_quick_add is off — until round 2 rebuilds the card. The width half of the query
   is load-bearing for evidence too: Playwright's fullPage capture drops the touch emulation, so a hover-only
   query never shows in a full-page mobile PNG. */
.hdt-card-product__btn-ultra{--atc-cl:rgb(var(--en-text-inverse));--atc-bg-cl:rgb(var(--en-button-primary));--atc-cl-hover:rgb(var(--en-text-inverse));--atc-bg-cl-hover:rgb(var(--en-button-primary-hover))}
@media (hover:none),(max-width:900px){.hdt-card-product__btn-ultra{visibility:hidden}}

/* ---------- section root helper + container (§3.3) ---------- */
.env2-section{position:relative;background:transparent;color:var(--env2-ink);font-family:var(--env2-sans);font-weight:300;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;direction:rtl;text-align:start}
.env2-section img{display:block;max-width:100%}
.env2-section a{color:inherit;text-decoration:none}
.env2-section bdi{unicode-bidi:isolate}
.env2-section :focus-visible{outline:2px solid var(--env2-glow);outline-offset:4px}
.env2-wrap{width:min(var(--env2-w),100% - 2*var(--env2-gut));margin-inline:auto}
.env2-wrap--wide{width:min(1500px,100% - 2*var(--env2-gut));margin-inline:auto}

/* ---------- type helpers (§3.2) ---------- */
.env2-h{font-family:var(--env2-serif);font-weight:700;line-height:.98;letter-spacing:-.01em;text-wrap:balance;margin:0;color:var(--env2-ink)}
.env2-h em,.env2-h .env2-glow{font-style:normal;color:var(--env2-glow)}
.env2-serif{font-family:var(--env2-serif)}
.env2-lead{font-family:var(--env2-sans);font-weight:300;font-size:clamp(17px,1.4vw,21px);line-height:1.5;max-width:38ch;color:var(--env2-ink-2);margin:0}
.env2-eyebrow{display:flex;align-items:center;gap:14px;margin:0;font-family:var(--env2-sans);font-size:12px;font-weight:500;line-height:1.3;letter-spacing:.18em;text-transform:uppercase;color:var(--env2-gold)}
.env2-eyebrow::before{content:"";flex:none;width:34px;height:1px;background:var(--env2-gold);opacity:.8}
.env2-eyebrow--ink{color:var(--env2-ink)}
.env2-kicker{font-family:var(--env2-sans);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--env2-gold)}
.env2-price{font-family:var(--env2-serif);font-weight:500;font-variant-numeric:tabular-nums;font-size:var(--env2-price-size,24px);line-height:1.1;color:var(--env2-glow);white-space:nowrap;unicode-bidi:isolate}
.env2-price bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.env2-price__from{font-family:var(--env2-sans);font-weight:400;font-size:.62em;color:var(--env2-ink-2);margin-inline-end:.15em;letter-spacing:0}
.env2-hair{border:0;border-top:1px solid var(--env2-hair);margin:0}

/* ---------- buttons + links (§3.4 #5) ---------- */
.env2-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;margin:0;padding:14px 22px;min-height:0;border:0;border-radius:999px;appearance:none;-webkit-appearance:none;cursor:pointer;font-family:var(--env2-sans);font-weight:500;font-size:15px;line-height:1.2;letter-spacing:0;text-transform:none;text-decoration:none;background:var(--env2-glow);color:var(--env2-btn-ink);box-shadow:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .5s,color .3s,background-color .3s}
.env2-btn:hover,.env2-btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 40px -8px rgba(255,211,148,.55);background:var(--env2-glow);color:var(--env2-btn-ink);text-decoration:none}
.env2-btn--ghost,.env2-btn--ghost:hover,.env2-btn--ghost:focus-visible{background:transparent;color:var(--env2-ink)}
.env2-btn--ghost{box-shadow:inset 0 0 0 1px var(--env2-hair-btn)}
.env2-btn--ghost:hover,.env2-btn--ghost:focus-visible{box-shadow:inset 0 0 0 1px var(--env2-glow),0 10px 40px -12px rgba(255,211,148,.4)}
.env2-btn--sm{padding:10px 16px;font-size:13.5px}
.env2-btn svg{width:16px;height:16px;flex:none}
.env2-buy{display:inline-block;margin:0;padding:0}
.env2-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--env2-sans);font-size:14px;font-weight:500;line-height:1.3;color:var(--env2-ink-2);border-bottom:1px solid var(--env2-hair-btn);padding-bottom:3px;text-decoration:none;transition:color .3s,border-color .3s}
.env2-link:hover,.env2-link:focus-visible{color:var(--env2-glow);border-color:var(--env2-glow);text-decoration:none}
.env2-link svg{width:14px;height:14px;flex:none}
@media (max-width:900px){.env2-btn{font-size:14px;padding:13px 20px}.env2-btn--sm{font-size:14px;padding:14px 18px;min-height:44px}.env2-link{position:relative}.env2-link::before{content:"";position:absolute;inset:-11px -6px}}

/* ---------- stars (§3.1): static layer, per-section opacity via --env2-stars ---------- */
.env2-stars{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:var(--env2-stars,.25);
  background-image:
   radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent 61%),
   radial-gradient(1.2px 1.2px at 78% 12%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 33% 62%,#fff 60%,transparent 61%),
   radial-gradient(1.4px 1.4px at 61% 34%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 88% 71%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 45% 9%,#fff 60%,transparent 61%),
   radial-gradient(1.2px 1.2px at 23% 87%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 69% 84%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 5% 48%,#fff 60%,transparent 61%),
   radial-gradient(1.3px 1.3px at 95% 42%,#fff 60%,transparent 61%),
   radial-gradient(1px 1px at 52% 55%,#fff 60%,transparent 61%);
  background-size:900px 700px}

/* ---------- the lamp device (§3.4 #1): dim until reached, then lit, never dark again ----------
   --lit is 1 by default (no JS = lit). Only html.env2-js dims lamps; .lit re-lights them. */
.env2-js [data-lamp]{--lit:0}
.env2-js [data-lamp].lit{--lit:1}
[data-lamp] .env2-ph{position:relative;overflow:hidden;background:#05070c;isolation:isolate}
[data-lamp] .env2-ph img{width:100%;height:100%;object-fit:cover;filter:brightness(calc(.22 + .78*var(--lit,1))) saturate(calc(.4 + .6*var(--lit,1)));transition:filter 1.6s cubic-bezier(.2,.7,.2,1);transform:scale(1.02)}
[data-lamp] .env2-ph::after{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(60% 55% at 50% 45%,rgba(255,211,148,.42),rgba(255,211,148,0) 70%);opacity:var(--lit,1);transition:opacity 1.6s .2s;mix-blend-mode:screen}
[data-lamp] .env2-halo{position:absolute;inset:-12%;pointer-events:none;background:radial-gradient(50% 50% at 50% 60%,rgba(255,196,110,.35),transparent 70%);opacity:var(--lit,1);transition:opacity 2s .3s;z-index:-1;filter:blur(14px)}
[data-lamp] .env2-pool{position:absolute;inset:auto -30% -18% -30%;height:60%;pointer-events:none;background:radial-gradient(50% 60% at 50% 40%,rgba(255,196,110,.28),transparent 70%);opacity:var(--lit,1);transition:opacity 1.8s .2s;filter:blur(12px);z-index:-1}
@keyframes env2-lamp-on{0%{opacity:0}40%{opacity:1}55%{opacity:.25}70%{opacity:1}100%{opacity:1}}
@keyframes env2-flick{0%{opacity:1}30%{opacity:.15}60%{opacity:.9}80%{opacity:.3}100%{opacity:1}}

/* ---------- reduced motion (§3.4): lamps lit, no sweeps, no parallax, no transitions ---------- */
@media (prefers-reduced-motion:reduce){
  .env2-js [data-lamp],[data-lamp],.env2-js [data-lamp].lit{--lit:1}
  .env2-section,.env2-section *,.env2-section *::before,.env2-section *::after,.env2-btn,.env2-link{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
<style>
/* ---------- page ground (§3.1): night measured in px, not % ----------
   Screen 1 is a photo ground painted by elmsnest-v2-coll-scene; the document below it is this one
   gradient and nothing else. No section paints a background (§3.1: the only card surface anywhere on
   this page is the scrim --env2-scrim + backdrop-filter, used exactly twice). */
html body.hdt-page-type-collection{
  background-color:#020306;
  background-image:linear-gradient(180deg,
    #0b1526 0px,
    #0a1120 620px,
    #080e1c 1500px,
    #060a14 2600px,
    #04070e 3800px,
    #020306 5000px);
  background-repeat:no-repeat;
  background-size:100% 100%;
  background-attachment:scroll;
  min-height:100vh;
}
/* A page that is SHORTER than the gradient (6 products, one screen) must not be handed a squashed
   sky: background-size:100% 100% would compress the 5000px ramp into a 2000px document and the short
   page would go black three times faster than the long one. Painting the ramp on a fixed 5000px box
   anchored at the top and letting #020306 fill the rest keeps every collection identical for the first
   5000px, which is the whole point of §3.1. */
html body.hdt-page-type-collection{background-size:100% 5000px}
/* Kalles wraps the template in painted containers; the sky must be visible between sections. */
html body.hdt-page-type-collection #wrapper,
html body.hdt-page-type-collection .main-content,
html body.hdt-page-type-collection main,
html body.hdt-page-type-collection #MainContent,
html body.hdt-page-type-collection .hdt-main-content,
html body.hdt-page-type-collection .hdt-page-content,
html body.hdt-page-type-collection .shopify-section{background:transparent}
/* The header is transparent over the scene: the scene is the first section, starts at top 0 and clears
   the 70px bar with its own padding (§4.1). Kill any inherited gap above it — Kalles ships a top margin
   on the first collection section for its taupe banner, which this template retires (§5.4). */
html body.hdt-page-type-collection #MainContent>.shopify-section:first-child,
html body.hdt-page-type-collection .hdt-main-content>.shopify-section:first-child{margin-block-start:0;padding-block-start:0}
html body.hdt-page-type-collection #MainContent>.shopify-section:first-child .env2-section,
html body.hdt-page-type-collection .hdt-main-content>.shopify-section:first-child .env2-section{margin-block-start:0}
/* No horizontal page scroll at 360px (§6.13). The scene, the band scenes and the goodnight photo are
   full-bleed, and the ruler's dot rails scroll INSIDE their own row — never the document. */
html body.hdt-page-type-collection{overflow-x:hidden}
/* §3.2's tap-target floor, on this template only. elmsnest-v2-core sizes .env2-btn--sm at 36px tall on
   desktop (it was sized for the PDP related row) and only raises it to 44px under 900px. The collection
   spec asks for 48px, 44px absolute, with no viewport caveat — so the floor is set here, scoped to the
   collection body, and the PDP is not touched. Measured in the plumbing render: 36px -> 44px. */
html body.hdt-page-type-collection .env2-btn--sm{min-block-size:44px}
html body.hdt-page-type-collection .env2-pdp-card__action .env2-btn{min-block-size:44px}
/* Kalles' collection chrome that §5.4 retires from templates/collection.json. The section files stay on
   the theme until the owner signs off, so nothing is deleted; these two belts only make sure that a
   left-over instance cannot paint a cream strip or a taupe banner over the night. */
html body.hdt-page-type-collection .hdt-collection-toolbar,
html body.hdt-page-type-collection .hdt-collection-banner{background:transparent}
</style>
<style>
/* ---------- 4.7 the way out: one outlined word over the garden, then two hairlines of plain anchors ----------
   The seventh and last shape on the page (do-not 20): scene photo+card · ruler numeral+rail ·
   bands five compositions · span rungs · ledger numbered rows · terms two columns · and this —
   a display word that is only an outline, with the way onward written under it in ordinary links.
   The section paints no background: the ground is the pixel-measured body gradient from
   elmsnest-v2-ground-collection, and the only things this file puts above it are the star layer at
   the 3.1 depth for this position (.70) and the photograph. */
.env2-coll-goodnight{padding-block:clamp(96px,11vw,150px) 44px;isolation:isolate;overflow:hidden;min-block-size:clamp(520px,60svh,760px);display:flex;align-items:flex-end}
.env2-coll-goodnight__wrap{position:relative;z-index:1;inline-size:min(var(--env2-w),100% - 2*var(--env2-gut))}

/* the garden: collection.image at 80% once lit, object-position 50% 70% (4.7), under a sky-4 veil.
   The veil is heaviest at the top seam — where the terms section above must not be cut by a hard
   edge — and at the foot, where the links are read; it thins across the middle band the word sits
   in, so the outline has a garden inside it rather than a flat night. The colour is #020306, which
   is --env2-sky-4; it is written as rgba here because a gradient stop needs the alpha and the token
   is a hex. */
.env2-coll-goodnight__garden{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:calc(.8*var(--lit,1));transition:opacity 2.4s cubic-bezier(.2,.7,.2,1);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 22%);mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0,#000 22%)}
.env2-coll-goodnight__garden::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,3,6,.92) 0,rgba(2,3,6,.46) 26%,rgba(2,3,6,.62) 58%,rgba(2,3,6,.9) 82%,rgba(2,3,6,.95) 100%)}
.env2-coll-goodnight__img{inline-size:100%;block-size:100%;object-fit:cover;object-position:var(--env2-goodnight-pos,50% 70%);display:block;filter:saturate(1.06) contrast(1.04) brightness(1.08)}

/* the word: outline only, NEVER filled (4.7, 3.2). The 1.5px stroke brightens with the lamp
   (.30 -> .62) and a faint breath of glow sits behind it. It is aria-hidden — punctuation, not copy. */
.env2-coll-goodnight__big{margin:0 0 clamp(34px,5vw,68px);font-family:var(--env2-serif);font-weight:900;font-size:clamp(52px,10.5vw,164px);line-height:.86;letter-spacing:.01em;color:transparent;-webkit-text-stroke:1.5px rgba(244,238,227,calc(.3 + .32*var(--lit,1)));text-shadow:0 0 40px rgba(255,211,148,calc(.14*var(--lit,1)));transition:-webkit-text-stroke-color 2.4s .4s,text-shadow 2.4s .4s;white-space:nowrap;user-select:none}

/* hairline 1 — the places and the catalogue, plain anchors on ONE rule (4.7) */
.env2-coll-goodnight__next{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px clamp(24px,3vw,44px);padding-block-start:18px;border-block-start:1px solid var(--env2-hair)}

<script>
(function(){
  if (window.env2 && window.env2.observe) return;
  var root = document.documentElement;
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen = (typeof WeakSet === 'function') ? new WeakSet() : null;
  var tracked = [];
  var io = null;

  function light(el){ if (el && el.classList) el.classList.add('lit'); }
  function inView(el){
    var vh = window.innerHeight || root.clientHeight; var r = el.getBoundingClientRect();
    return r.top < vh * 0.82 && r.bottom > vh * 0.1;
  }
  /* belt and braces: light anything already inside the viewport (passive scroll, rAF) */
  function sweep(){
    for (var i = tracked.length - 1; i >= 0; i--) {
      var el = tracked[i];
      if (el.classList.contains('lit')) { tracked.splice(i, 1); continue; }
      if (inView(el)) { light(el); if (io) io.unobserve(el); tracked.splice(i, 1); }
    }
  }
  function getIO(){
    if (io || !('IntersectionObserver' in window)) return io;
    io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) { light(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.25, rootMargin: '0px 0px -6% 0px' });
    return io;
  }
  /* observe(root): idempotent, safe per section, safe on document. Lamps with
     data-lamp="manual" are left to their section (light them with env2.light(el)),
     except under reduced motion, where every lamp is lit at once. */
  function observe(rootEl){
    rootEl = rootEl || document;
    var list = [];
    if (rootEl.nodeType === 1 && rootEl.hasAttribute('data-lamp')) list.push(rootEl);
    var q = rootEl.querySelectorAll ? rootEl.querySelectorAll('[data-lamp]') : [];
    for (var i = 0; i < q.length; i++) list.push(q[i]);
    list.forEach(function(el){
      if (el.classList.contains('lit')) return;
      if (seen ? seen.has(el) : el.__env2seen) return;
      if (el.getAttribute('data-lamp') === 'manual' && !rm) return;
      if (seen) seen.add(el); else el.__env2seen = true;
      if (rm || !getIO()) { light(el); return; }
      tracked.push(el); io.observe(el);
    });
    sweep();
    return list.length;
  }

  /* scroll progress → --env2-p (alias --p) on <html>; the sun rail and the hero use it */
  var ticking = false;
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(function(){
      var max = Math.max(1, root.scrollHeight - window.innerHeight);
      var y = window.scrollY || window.pageYOffset || 0;
      var p = rm ? 0 : Math.min(1, Math.max(0, y / max));
      var v = p.toFixed(4);
      root.style.setProperty('--env2-p', v); root.style.setProperty('--p', v);
      sweep();
      ticking = false;
    });
  }

  window.addEventListener('resize', onScroll);
  window.addEventListener('load', onScroll);

  /* in-page anchors to sections (#env2-…) scroll smoothly, instantly under reduced motion */
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#env2-"]') : null;
    if (!a) return;
    var t = document.getElementById(a.getAttribute('href').slice(1));
    if (!t) return;
    e.preventDefault();
    t.scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block: 'start' });
    if (window.history && history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
  });

  /* buy forms (snippets/elmsnest-v2-buy): add to cart without leaving the page and open the Kalles
     cart drawer. Anything missing (no drawer, no fetch, request failed) → the native POST still works. */
  document.addEventListener('submit', function(e){
    var form = e.target;
    if (!form || !form.matches || !form.matches('form[data-env2-buy]')) return;
    var drawer = document.querySelector('hdt-cart-drawer[section-id]');
    if (!drawer || typeof window.fetch !== 'function' || typeof window.FormData !== 'function') return;
    e.preventDefault();
    var btn = form.querySelector('[type="submit"]');
    var fd = new FormData(form);
    fd.append('sections', drawer.getAttribute('section-id'));
    fd.append('sections_url', location.pathname);
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    var rootPath = (window.Shopify && window.Shopify.routes && window.Shopify.routes.root) || '/';
    fetch(rootPath + 'cart/add.js', {
      method: 'POST', body: fd,
      headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/javascript' }
    }).then(function(r){ return r.json(); }).then(function(j){
      if (!j || j.status) throw new Error('cart/add failed');
      /* The drawer is the theme's, and on a slow phone or a failed chunk its custom element can still
         be un-upgraded when the POST succeeds — the item enters the cart and the screen does not
         change, so the same button gets pressed twice. The page therefore acknowledges the add on its
         own, before and regardless of the drawer: the label says so and the control stays disabled
         while it does. Restored by the finally-branch below. */
      if (btn && !btn.getAttribute('data-env2-said')) {
        btn.setAttribute('data-env2-said', btn.textContent);
        btn.textContent = btn.getAttribute('data-env2-added') || 'נוסף לסל';
        setTimeout(function(){
          var was = btn.getAttribute('data-env2-said');
          if (was !== null) { btn.textContent = was; btn.removeAttribute('data-env2-said'); }
          btn.disabled = false; btn.removeAttribute('aria-busy');

      }

        resource: {}, sourceId: String(fd.get('id')), cartData: j,
        actionAfterATC: 'open_cart_drawer', source: 'product-form-component',
        data: { itemCount: 1, sections: j.sections }
      } }));
    }).catch(function(){
      if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
      form.submit();
    }).then(function(){
      if (btn && !btn.getAttribute('data-env2-said')) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
    });
  });

  function boot(){ observe(document); onScroll(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  document.addEventListener('shopify:section:load', function(e){ observe(e.target || document); });
})();

<script>
/* 4.7 the way out: the section root is the lamp — hand it to the shared observer so the garden
   fades from 0 to its 80% over 2.4s when the page reaches it (3.3, "goodnight — the garden — on
   arrival"). That is the whole of this section's JavaScript. Without window.env2, or with JS off
   entirely, --lit stays 1 and the garden and the word are at full strength from the first paint. */
(function () {
  function init(el) {
    if (el.__env2CollGoodnight) return;
    el.__env2CollGoodnight = true;
    if (window.env2 && window.env2.observe) {
      window.env2.observe(el);
    } else {
      if (el.hasAttribute('data-lamp')) el.classList.add('lit');
      el.querySelectorAll('[data-lamp]').forEach(function (l) { l.classList.add('lit'); });
    }
  }
  function boot(root) {
    (root && root.querySelectorAll ? root : document).querySelectorAll('[data-env2-coll-goodnight]').forEach(init);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { boot(document); });
  else boot(document);
  document.addEventListener('shopify:section:load', function (e) { boot(e.target || document); });
})();
